# The universal viewer app: one multiplatform target, one bundle ID, macOS + iOS/iPadOS.
# Generated project: `cd App && xcodegen` rewrites Mirage.xcodeproj (committed, so building needs no xcodegen).
# It compiles the viewer sources directly: Session/ on both platforms, macOS/ (the AppKit shell, the same code the
# SwiftPM `mirage-viewer` executable builds) on macOS, iOS/ (the UIKit shell) on iOS; MirageCore comes from the package.
# macOS: scripts/make-viewer-app.sh builds this target's macOS slice. iOS: scripts/testflight.sh archives and uploads.
name: Mirage
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  mirage:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: M8MME6Q9DA
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Mirage:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ../Sources/mirage-viewer/Session
      - path: ../Sources/mirage-viewer/macOS
        destinationFilters: [macOS]
      - path: ../Sources/mirage-viewer/iOS
        destinationFilters: [iOS]
      - path: ../Resources/AppIcon/Mirage.icon
        buildPhase: resources
      - path: Info.plist
        buildPhase: none
    dependencies:
      - package: mirage
        product: MirageCore
    postBuildScripts:
      # macOS: the host inside the app (Contents/MacOS/miraged + Contents/Library/LaunchAgents), signed for stable TCC grants.
      - name: Embed host
        script: "\"$PROJECT_DIR/../scripts/embed-host.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: $(MIRAGE_DISPLAY_NAME)
        EXECUTABLE_NAME: mirage-viewer   # what scripts and the README run: Mirage.app/Contents/MacOS/mirage-viewer
        PRODUCT_MODULE_NAME: MirageViewer
        PRODUCT_BUNDLE_IDENTIFIER: com.paulherz.mirage
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Mirage
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MIRAGE_DISPLAY_NAME: Mirage
        # Version identity (DESIGN §3.10), stamped on the xcodebuild command line: CURRENT_PROJECT_VERSION is the build (the
        # commit count), MIRAGE_COMMIT the short hash, MIRAGE_CHANNEL the channel a release goes to (empty: a local build).
        MIRAGE_COMMIT: ""
        MIRAGE_CHANNEL: ""
        MIRAGE_TEST_EXIT_IN_MAIN: ""   # YES: release.sh --broken, the rollback test build
        INFOPLIST_KEY_CFBundleDisplayName: $(MIRAGE_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Paul Herz. MIT License."
        "INFOPLIST_KEY_NSPrincipalClass[sdk=macosx*]": NSApplication
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the Embed host phase runs swift build in the package
        # Signing (DESIGN §3.10): the hardened runtime on every Mac build (notarization needs it; capture, input injection and
        # QUIC need no exceptions). The identity stays automatic here (Apple Development, and the iOS slice's own);
        # scripts/make-viewer-app.sh and release.sh sign the Mac app with Developer ID Application (team M8MME6Q9DA) on the
        # xcodebuild command line, and embed-host.sh signs miraged with the same identity and options.
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Mirage connects to the Macs you pair with on your network or tailnet."
